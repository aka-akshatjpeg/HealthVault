<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <style>
      path, circle, rect, line, polyline, ellipse {
        fill: none;
        stroke: #0d9488;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Stethoscope (top-left) -->
  <g transform="translate(18, 18)">
    <path d="M8,2 C8,2 4,2 4,6 L4,16 C4,20 8,22 12,22 C16,22 20,20 20,16 L20,14"/>
    <circle cx="22" cy="12" r="3"/>
    <path d="M8,2 L14,2"/>
    <path d="M11,2 L11,8"/>
  </g>

  <!-- Pill/capsule -->
  <g transform="translate(65, 12)">
    <rect x="0" y="4" width="24" height="10" rx="5"/>
    <line x1="12" y1="4" x2="12" y2="14"/>
  </g>

  <!-- Syringe -->
  <g transform="translate(115, 8)">
    <path d="M4,20 L16,8"/>
    <rect x="12" y="4" width="8" height="6" rx="1" transform="rotate(45 16 7)"/>
    <line x1="2" y1="22" x2="4" y2="20"/>
    <line x1="8" y1="10" x2="10" y2="12"/>
    <line x1="11" y1="7" x2="13" y2="9"/>
  </g>

  <!-- Heart rate / pulse -->
  <g transform="translate(155, 15)">
    <polyline points="0,8 5,8 8,2 11,14 14,8 20,8 23,8"/>
  </g>

  <!-- Medicine bottle -->
  <g transform="translate(205, 8)">
    <rect x="4" y="7" width="14" height="16" rx="2"/>
    <rect x="6" y="4" width="10" height="4" rx="1"/>
    <line x1="8" y1="13" x2="14" y2="13"/>
    <line x1="11" y1="10" x2="11" y2="16"/>
  </g>

  <!-- Thermometer -->
  <g transform="translate(248, 10)">
    <rect x="9" y="0" width="6" height="18" rx="3"/>
    <circle cx="12" cy="21" r="4"/>
    <line x1="12" y1="15" x2="12" y2="21"/>
  </g>

  <!-- Bandage/plaster -->
  <g transform="translate(12, 65)">
    <rect x="0" y="6" width="26" height="10" rx="5"/>
    <rect x="9" y="6" width="8" height="10"/>
    <circle cx="4" cy="11" r="1.5"/>
    <circle cx="22" cy="11" r="1.5"/>
  </g>

  <!-- Heart with pulse -->
  <g transform="translate(60, 65)">
    <path d="M12,20 C12,20 2,13 2,7 C2,4.2 4.2,2 7,2 C9,2 10.8,3.2 12,5 C13.2,3.2 15,2 17,2 C19.8,2 22,4.2 22,7 C22,13 12,20 12,20 Z"/>
  </g>

  <!-- Gloves -->
  <g transform="translate(105, 62)">
    <path d="M8,20 L8,8 C8,6.9 8.9,6 10,6 L10,2 C10,1.4 10.4,1 11,1 C11.6,1 12,1.4 12,2 L12,8"/>
    <path d="M12,8 L12,4 C12,3.4 12.4,3 13,3 C13.6,3 14,3.4 14,4 L14,8"/>
    <path d="M14,8 L14,5 C14,4.4 14.4,4 15,4 C15.6,4 16,4.4 16,5 L16,8"/>
    <path d="M16,8 L16,6 C16,5.4 16.4,5 17,5 C17.6,5 18,5.4 18,6 L18,12 C18,16.4 15,20 11,20 L8,20"/>
  </g>

  <!-- Scissors -->
  <g transform="translate(155, 62)">
    <circle cx="6" cy="6" r="3"/>
    <circle cx="6" cy="16" r="3"/>
    <line x1="8.5" y1="8.5" x2="20" y2="20"/>
    <line x1="8.5" y1="13.5" x2="20" y2="2"/>
  </g>

  <!-- Cross / Medical plus -->
  <g transform="translate(205, 63)">
    <rect x="8" y="2" width="6" height="18" rx="2"/>
    <rect x="2" y="8" width="18" height="6" rx="2"/>
  </g>

  <!-- Dropper/IV drop -->
  <g transform="translate(250, 63)">
    <path d="M12,2 L12,14"/>
    <path d="M7,8 C7,8 4,12 4,15 C4,18.3 7.7,21 12,21 C16.3,21 20,18.3 20,15 C20,12 17,8 17,8 L12,2 L7,8 Z"/>
  </g>

  <!-- Stethoscope row 2 -->
  <g transform="translate(12, 120)">
    <path d="M8,2 C8,2 4,2 4,6 L4,14 C4,18 8,20 12,20 C16,20 20,18 20,14 L20,12"/>
    <circle cx="22" cy="10" r="3"/>
    <path d="M8,2 L14,2"/>
    <path d="M11,2 L11,7"/>
  </g>

  <!-- Mask -->
  <g transform="translate(55, 118)">
    <path d="M2,8 C2,8 4,4 12,4 C20,4 22,8 22,8 L22,14 C22,14 20,18 12,18 C4,18 2,14 2,14 Z"/>
    <path d="M2,8 C2,8 7,12 12,12 C17,12 22,8 22,8"/>
    <path d="M2,11 L0,10"/>
    <path d="M22,11 L24,10"/>
  </g>

  <!-- Tablet/pill oval -->
  <g transform="translate(108, 122)">
    <ellipse cx="12" cy="10" rx="10" ry="6"/>
    <line x1="2" y1="10" x2="22" y2="10"/>
  </g>

  <!-- Clipboard -->
  <g transform="translate(158, 118)">
    <rect x="4" y="4" width="16" height="18" rx="2"/>
    <path d="M9,4 L9,2 C9,1.4 9.4,1 10,1 L14,1 C14.6,1 15,1.4 15,2 L15,4"/>
    <line x1="8" y1="10" x2="16" y2="10"/>
    <line x1="8" y1="14" x2="16" y2="14"/>
    <line x1="8" y1="18" x2="13" y2="18"/>
  </g>

  <!-- Crutch/injection -->
  <g transform="translate(205, 115)">
    <line x1="12" y1="2" x2="12" y2="22"/>
    <line x1="4" y1="8" x2="12" y2="8"/>
    <path d="M4,6 L4,10"/>
  </g>

  <!-- DNA / helix simple -->
  <g transform="translate(245, 118)">
    <path d="M6,2 C10,5 14,5 18,8 C14,11 10,11 6,14 C10,17 14,17 18,20"/>
    <path d="M18,2 C14,5 10,5 6,8 C10,11 14,11 18,14 C14,17 10,17 6,20"/>
  </g>

  <!-- Ambulance cross simple -->
  <g transform="translate(18, 175)">
    <rect x="0" y="4" width="24" height="16" rx="3"/>
    <rect x="8" y="8" width="8" height="2"/>
    <rect x="11" y="6" width="2" height="6"/>
  </g>

  <!-- Test tube -->
  <g transform="translate(62, 172)">
    <path d="M8,2 L8,16 C8,18.2 9.8,20 12,20 C14.2,20 16,18.2 16,16 L16,2"/>
    <line x1="7" y1="6" x2="17" y2="6"/>
  </g>

  <!-- Medical bag -->
  <g transform="translate(108, 172)">
    <rect x="2" y="8" width="20" height="14" rx="3"/>
    <path d="M8,8 L8,5 C8,3.3 9.3,2 11,2 L13,2 C14.7,2 16,3.3 16,5 L16,8"/>
    <line x1="12" y1="12" x2="12" y2="18"/>
    <line x1="9" y1="15" x2="15" y2="15"/>
  </g>

  <!-- Heartbeat line -->
  <g transform="translate(153, 178)">
    <polyline points="0,6 4,6 6,1 9,12 12,6 16,6 18,6 22,6"/>
  </g>

  <!-- Blood pressure cuff / arm -->
  <g transform="translate(203, 172)">
    <rect x="2" y="8" width="20" height="12" rx="6"/>
    <path d="M9,8 C9,5.2 11.2,3 14,3 L14,3"/>
    <circle cx="14" cy="3" r="2"/>
  </g>

  <!-- Microscope simplified -->
  <g transform="translate(248, 172)">
    <line x1="6" y1="20" x2="18" y2="20"/>
    <line x1="12" y1="20" x2="12" y2="14"/>
    <rect x="8" y="8" width="8" height="8" rx="1"/>
    <circle cx="12" cy="4" r="3"/>
    <line x1="5" y1="14" x2="19" y2="14"/>
  </g>

  <!-- Pills row bottom -->
  <g transform="translate(18, 232)">
    <rect x="0" y="4" width="20" height="8" rx="4"/>
    <line x1="10" y1="4" x2="10" y2="12"/>
  </g>

  <g transform="translate(58, 235)">
    <circle cx="8" cy="8" r="7"/>
    <line x1="2" y1="8" x2="14" y2="8"/>
  </g>

  <!-- Scale/balance -->
  <g transform="translate(104, 228)">
    <line x1="12" y1="2" x2="12" y2="20"/>
    <line x1="4" y1="6" x2="20" y2="6"/>
    <path d="M4,6 C4,6 2,10 4,12 C6,14 8,12 8,12 C8,12 6,8 4,6"/>
    <path d="M20,6 C20,6 22,10 20,12 C18,14 16,12 16,12 C16,12 18,8 20,6"/>
    <line x1="8" y1="20" x2="16" y2="20"/>
  </g>

  <!-- Stethoscope small -->
  <g transform="translate(155, 235)">
    <path d="M6,2 C6,2 3,2 3,5 L3,11 C3,14 6,16 9,16 C12,16 15,14 15,11 L15,10"/>
    <circle cx="16.5" cy="9" r="2.5"/>
    <path d="M6,2 L10,2"/>
    <path d="M8,2 L8,6"/>
  </g>

  <!-- First Aid kit -->
  <g transform="translate(200, 228)">
    <rect x="2" y="6" width="20" height="16" rx="2"/>
    <path d="M8,6 L8,4 C8,2.9 8.9,2 10,2 L14,2 C15.1,2 16,2.9 16,4 L16,6"/>
    <line x1="12" y1="11" x2="12" y2="17"/>
    <line x1="9" y1="14" x2="15" y2="14"/>
  </g>

  <!-- Capsule pill diagonal -->
  <g transform="translate(248, 232)">
    <rect x="2" y="8" width="20" height="8" rx="4" transform="rotate(-30 12 12)"/>
    <line x1="7.1" y1="6.9" x2="16.9" y2="17.1" transform="rotate(-30 12 12)"/>
  </g>
</svg>
