{% extends "base.html" %}
{% block title %}Sign In — HealthVault{% endblock %}

{% block content %}
<style>
  .auth-page {
    min-height: calc(100vh - var(--hv-topbar-height, 60px));
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
  }
  .auth-card {
    width: 100%; max-width: 420px;
    background: var(--hv-surface);
    border: 1px solid var(--hv-border);
    border-radius: var(--hv-radius-xl);
    box-shadow: var(--hv-shadow-md);
    padding: 40px; text-align: center;
  }
  .auth-icon {
    width: 60px; height: 60px; border-radius: 16px;
    background: var(--hv-teal-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; color: var(--hv-teal);
    margin: 0 auto 22px;
  }
  .auth-title { font-size: 1.45rem; font-weight: 700; color: var(--hv-text-1); margin-bottom: 10px; }
  .auth-subtitle { font-size: 0.875rem; color: var(--hv-text-3); line-height: 1.6; margin-bottom: 28px; }
  .btn-auth-primary {
    display: block; width: 100%; padding: 12px; border: none;
    border-radius: var(--hv-radius); background: var(--hv-navy);
    color: #fff; font-size: 0.9rem; font-weight: 600;
    cursor: pointer; text-decoration: none;
    transition: opacity 0.2s;
  }
  .btn-auth-primary:hover { opacity: 0.88; }
  body.dark-mode .btn-auth-primary { background: var(--hv-teal); color: #0B0F12; }
</style>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-icon"><i class="bi bi-shield-lock"></i></div>
    <h1 class="auth-title">One-time code sign-in retired</h1>
    <p class="auth-subtitle">
      The email&nbsp;+&nbsp;password OTP login is no&nbsp;longer available.<br>
      Please use Google, Apple, or phone verification to sign&nbsp;in.
    </p>
    <a href="{{ url_for('auth.login') }}" class="btn-auth-primary">Go to sign-in</a>
  </div>
</div>
{% endblock %}
