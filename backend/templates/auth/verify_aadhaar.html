{% extends "base.html" %}
{% block title %}Verify Aadhaar - HealthVault{% endblock %}

{% block content %}
<style>
.auth-wrap {
    min-height: 88vh; display: flex;
    align-items: center; justify-content: center;
    padding: 20px;
}
.auth-card {
    width: 100%; max-width: 400px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 24px; overflow: hidden;
    box-shadow: var(--shadow-lg);
    padding: 32px;
}
.auth-card i.bi-shield-check {
    font-size: 3rem; color: var(--success);
    margin-bottom: 16px; display: inline-block;
}
</style>

<div class="auth-wrap">
    <div class="auth-card text-center">
        <i class="bi bi-shield-check"></i>
        <h3 class="fw-bold mb-2">Verify Aadhaar</h3>
        <p class="text-muted mb-4">We've sent a 6-digit OTP to the mobile number registered with your Aadhaar (<strong>{{ masked_aadhaar }}</strong>).</p>

        <form method="POST">
            <div class="mb-4">
                <input type="text" name="otp" class="form-control text-center fs-4 fw-bold" 
                       placeholder="· · · · · ·" maxlength="6" pattern="\d{6}" required
                       style="letter-spacing: 0.5rem; background: var(--input-bg); border: 2px solid var(--primary); color: var(--text-primary); border-radius: 12px; padding: 12px;">
            </div>
            <button type="submit" class="btn btn-primary w-100" style="border-radius: 12px; padding: 12px; font-weight: 600;">
                Verify & Create Account
            </button>
        </form>
    </div>
</div>
{% endblock %}
