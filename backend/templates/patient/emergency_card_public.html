<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Card - HealthVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/healthvault.css') }}">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <div class="card border-danger mb-4 shadow">
                    <div class="card-header bg-danger text-white">
                        <h4 class="mb-0"><i class="bi bi-heart-pulse-fill"></i> MEDICAL EMERGENCY ID</h4>
                    </div>
                    <div class="card-body py-5">
                        <p class="text-muted">No HealthVault ID provided.</p>
                        <p>If you are a first responder, please scan the patient's HealthVault QR code to view their emergency medical information.</p>
                        <a href="{{ url_for('auth.login') }}" class="btn btn-outline-danger mt-3">Provider Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
