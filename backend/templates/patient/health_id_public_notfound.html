<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Not Found — HealthVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .err-card { background:#fff; border-radius:20px; padding:40px; text-align:center; max-width:320px; }
    </style>
</head>
<body>
    <div class="err-card">
        <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size:3rem;"></i>
        <h4 class="mt-3 fw-bold">ID Not Found</h4>
        <p class="text-muted small">The HealthVault ID linked to this QR code could not be found. It may have been revoked or is invalid.</p>
        <a href="http://localhost:5000" class="btn btn-primary btn-sm">Go to HealthVault</a>
    </div>
</body>
</html>
