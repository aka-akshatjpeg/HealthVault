{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Access Requests</h2>
    
    <h4 class="mt-4">Pending Requests</h4>
    {% for req in pending_requests %}
    <div class="card mb-3 shadow-sm border-warning">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="mb-1">Dr. {{ req.provider.full_name }}</h5>
                    <p class="mb-1 text-muted">{{ req.provider.organization }}</p>
                    <p class="mb-0"><small>Purpose: {{ req.purpose }}</small></p>
                </div>
                <a href="{{ url_for('consent.review', request_id=req.id) }}" class="btn btn-primary">Review Request</a>
            </div>
        </div>
    </div>
    {% else %}
    <p class="text-muted">No pending access requests.</p>
    {% endfor %}
</div>
{% endblock %}
